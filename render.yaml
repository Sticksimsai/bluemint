services:
  - type: web
    name: bluemint-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: bluemint-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SOLANA_NETWORK
        value: mainnet
      - key: ADMIN_WALLETS
        value: ""
      - key: PLATFORM_OWNER_WALLET
        value: "85a8ERAhk1ZPYyGwj4zkjVKZdfqaEUcSpTt9GCz5xA7j"
      - key: PLATFORM_FEE_WALLET
        value: "85a8ERAhk1ZPYyGwj4zkjVKZdfqaEUcSpTt9GCz5xA7j"
      - key: RAYDIUM_PLATFORM_ID
        value: "GobSXmdvJMVk67KVwkyqGpoMEq6b6SoNrd7NwNW7iwM8"
      - key: SOLANA_RPC_URL
        value: "https://api.mainnet-beta.solana.com"
      - key: USDC_QUOTE_MINT
        value: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
      - key: RAYDIUM_GLOBAL_CONFIG_ID
        value: "8gj14w8vkNZjJTPak6e96Uf1sY438WKheH4s5dHyxiRw"
      - key: ENABLE_TOKEN_MINTING
        value: "false"
      - key: LAUNCH_MODE
        value: launchlab
      - key: LAUNCH_RAISE_USDC_UNITS
        value: "10000000000"
      - key: ENABLE_LAUNCHLAB_MINTING
        value: "true"
      - key: ENABLE_DEVNET_MINTING
        value: "false"
