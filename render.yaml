services:
  - type: web
    name: bluemint-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: bluemint-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SOLANA_NETWORK
        value: devnet
      - key: ADMIN_WALLETS
        value: ""
      - key: PLATFORM_OWNER_WALLET
        value: "85a8ERAhk1ZPYyGwj4zkjVKZdfqaEUcSpTt9GCz5xA7j"
      - key: PLATFORM_FEE_WALLET
        value: "85a8ERAhk1ZPYyGwj4zkjVKZdfqaEUcSpTt9GCz5xA7j"
      - key: RAYDIUM_PLATFORM_ID
        value: "Cg4vFQ1kyiNzCXWiiydiXJRB6B4GSnDEhoHVFkrtiiTV"
      - key: SOLANA_RPC_URL
        value: "https://api.devnet.solana.com"
